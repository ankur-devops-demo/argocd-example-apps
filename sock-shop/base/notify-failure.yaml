apiVersion: batch/v1
kind: Job
metadata:
  name: notify-failure
  annotations:
    argocd.argoproj.io/hook: SyncFail
spec:
  template:
    spec:
      containers:
        - name: notify
          image: busybox
          command: [ 'sh', '-c', 'echo Sync failed. Please check logs.' ]
      restartPolicy: Never